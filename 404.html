<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Vishwa K</title>
  <link rel="stylesheet" href="index.css">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕸️</text></svg>">
  <style>
    .four-oh-four {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .four-oh-four h1 {
      font-family: var(--font-head);
      font-size: clamp(5rem, 15vw, 10rem);
      font-weight: 800;
      color: var(--border);
      line-height: 1;
      margin-bottom: .5rem;
    }

    .four-oh-four h2 {
      font-family: var(--font-head);
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }

    .four-oh-four p {
      color: #888;
      margin-bottom: 2rem;
      max-width: 400px;
    }

    .four-oh-four .btn {
      margin-top: .5rem;
    }
  </style>
</head>

<body>
  <div class="four-oh-four">
    <h1>404</h1>
    <h2>Lost a packet somewhere.</h2>
    <p>The page you're looking for doesn't exist — maybe the sensor disconnected, or the route table's off. Either way,
      let's get you back.</p>
    <a href="index.html" class="btn btn-primary">Back to base →</a>
  </div>
</body>

</html>
